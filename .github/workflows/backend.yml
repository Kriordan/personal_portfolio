name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: library_test
          POSTGRES_PASSWORD: library_test
          POSTGRES_DB: library_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      LIBRARY_TEST_POSTGRES_URL: "postgresql+psycopg://library_test:library_test@127.0.0.1:5432/library_sync_test"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install poetry==2.4.3 pip-audit==2.10.1
      - run: poetry check --lock
      - run: poetry sync --no-interaction
      - run: poetry run pip check
      - run: pip-audit --path .venv/lib/python3.13/site-packages
      - run: poetry run python -m unittest discover -s tests
