<!doctype html>
<meta charset="utf-8">
<title>Flashcard Markdown security regression</title>
<h1>Flashcard Markdown security regression</h1>
<pre id="results">RUNNING</pre>
<div id="fixtures"></div>
<script src="../../node_modules/marked/lib/marked.umd.js"></script>
<script src="../../node_modules/dompurify/dist/purify.min.js"></script>
<script>
  // Load the application's real renderer against untrusted text, as Jinja does.
  const fixtures = document.getElementById("fixtures");
  const cases = [
    ["formatting", "**bold** and *italic*", (el) => el.querySelector("strong")?.textContent === "bold" && el.querySelector("em")?.textContent === "italic"],
    ["safe link", "[example](https://example.com)", (el) => el.querySelector("a")?.getAttribute("href") === "https://example.com"],
    ["code", "```html\n<img onerror=alert(1)>\n```", (el) => el.querySelector("code")?.textContent.includes("<img onerror=alert(1)>") && !el.querySelector("img")],
    ["script element", '<script>window.__xss = true;<\/script>', (el) => !el.querySelector("script")],
    ["image event", '<img src="data:image/png;base64,broken" onerror="window.__xss = true">', (el) => !el.querySelector("[onerror]")],
    ["SVG event", '<svg onload="window.__xss = true"><circle /></svg>', (el) => !el.querySelector("[onload]")],
    ["JavaScript link", '[bad](javascript:alert(1))', (el) => !el.querySelector("a[href]")],
    ["encoded JavaScript link", '<a href="java&#x73;cript:alert(1)">bad</a>', (el) => !el.querySelector("a[href]")],
    ["embedded document", '<iframe srcdoc="<script>parent.__xss=true;<\/script>"></iframe>', (el) => !el.querySelector("iframe")],
    ["rawtext breakout", '<img alt="</noscript><img src=x onerror=window.__xss=true>">', (el) => !el.querySelector("[onerror]")],
    ["MathML mutation", '<math><mtext><table><mglyph><style><!--</style><img title="--><img src=x onerror=window.__xss=true>">', (el) => !el.querySelector("[onerror]")],
  ];
  window.__xss = false;
  const elements = cases.map(([, input]) => {
    const el = document.createElement("div");
    el.dataset.markdown = "";
    el.textContent = input;
    fixtures.append(el);
    return el;
  });
  const loadRenderer = () => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "../../project/static/js/flashcards.js";
    script.onload = resolve;
    script.onerror = reject;
    document.body.append(script);
  });
  (async () => {
    if (!window.marked || !window.DOMPurify) throw new Error("Install the locked browser dependencies first");
    const version = DOMPurify.version;
    await loadRenderer();
    await new Promise((resolve) => setTimeout(resolve, 100));
    const outcomes = cases.map(([name, , check], i) => [name, check(elements[i])]);
    outcomes.push(["no payload executed", window.__xss === false]);

    // If the CDN or its integrity check fails, the renderer must use plain text.
    window.DOMPurify = undefined;
    const fallback = document.createElement("div");
    fallback.dataset.markdown = "";
    const dirty = '<img src=x onerror="window.__xss=true"> **plain**';
    fallback.textContent = dirty;
    fixtures.append(fallback);
    await loadRenderer();
    outcomes.push(["missing sanitizer falls back to text", !fallback.querySelector("img, strong") && fallback.textContent === dirty]);

    // Exercise the real website save handlers: failure must never advance,
    // and an explicit retry must preserve the original attempted payload.
    const review = document.createElement("section");
    review.innerHTML = `<div data-review-card data-flip-card><div id="card-question"></div><div id="card-answer"></div><div id="card-note-title"></div></div>
      <div id="review-progress"></div><div id="flashcard-actions"><button data-rating="4">Good</button></div>
      <p id="review-save-error" hidden></p><button id="review-save-retry" hidden>Retry</button><a id="review-reload" hidden>Reload</a>
      <div id="review-summary" hidden><p id="review-summary-text"></p><p id="review-summary-stats"></p>
      <a id="review-summary-done" href="#notes">Done</a></div>`;
    fixtures.append(review);
    for (const [id, value] of [["review-cards-data", [1, 2].map(n => ({ card_id: `note:${n}`, prompt: `Question ${n}`, response: "Answer", progress_revision: 0 }))], ["review-config-data", { rateUrl: "/rate", receiptUrl: "/ratings/REQUEST_ID", doneUrl: "javascript:window.__doneXss=true" }]]) {
      const script = document.createElement("script");
      script.type = "application/json"; script.id = id; script.textContent = JSON.stringify(value); review.append(script);
    }
    const posts = [];
    let behavior = "failed";
    window.fetch = async (url, options) => {
      if (options?.method === "POST") {
        posts.push(JSON.parse(options.body));
        if (behavior === "complete") return { ok: true, json: async () => ({ rating: 4, next_review_display: "Due tomorrow" }) };
        return { ok: false, status: behavior === "stale" ? 409 : 503 };
      }
      return { ok: true, json: async () => ({ receipt: behavior === "saved" ? { ...posts[0], next_review_display: "Due tomorrow" } : null }) };
    };
    const generatedIds = [];
    const randomUUID = crypto.randomUUID.bind(crypto);
    crypto.randomUUID = () => { const id = randomUUID(); generatedIds.push(id); return id; };
    await loadRenderer();
    const flip = review.querySelector("[data-review-card]");
    const good = review.querySelector("[data-rating]");
    const settle = () => new Promise(resolve => setTimeout(resolve, 20));
    flip.click(); good.click(); good.click();
    await settle();
    outcomes.push(["rapid rating taps send once", posts.length === 1]);
    outcomes.push(["failed save retains card and retry", document.getElementById("review-progress").textContent === "Card 1 of 2" && !document.getElementById("review-save-retry").hidden]);
    behavior = "saved";
    document.getElementById("review-save-retry").click();
    await settle();
    outcomes.push(["retry freezes original attempt", posts.length === 2 && JSON.stringify(posts[0]) === JSON.stringify(posts[1])]);
    outcomes.push(["receipt confirms one advance", document.getElementById("review-progress").textContent === "Card 2 of 2"]);
    behavior = "stale";
    flip.click(); good.click();
    await settle();
    outcomes.push(["stale review requires fresh queue", document.getElementById("review-progress").textContent === "Card 2 of 2" && !document.getElementById("review-reload").hidden && document.getElementById("review-save-retry").hidden]);
    const firstSession = posts[0].session_id;
    outcomes.push(["session ID comes from Web Crypto", generatedIds.includes(firstSession) && /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(firstSession)]);
    outcomes.push(["one session across cards with distinct requests", posts[2].session_id === firstSession && posts[2].request_id !== posts[0].request_id]);

    // A fresh page session finishes normally; malicious legacy configuration
    // must not replace the server-rendered navigation destination.
    const freshReview = review.cloneNode(true);
    review.replaceWith(freshReview);
    behavior = "complete";
    await loadRenderer();
    for (let i = 0; i < 2; i += 1) {
      freshReview.querySelector("[data-review-card]").click();
      freshReview.querySelector("[data-rating]").click();
      await settle();
    }
    outcomes.push(["fresh session has a fresh secure ID", posts[3].session_id !== firstSession && generatedIds.includes(posts[3].session_id)]);
    outcomes.push(["completed reviews retain summary", !document.getElementById("review-summary").hidden && document.getElementById("review-summary-text").textContent === "You reviewed 2 cards."]);
    window.__doneXss = false;
    const done = document.getElementById("review-summary-done");
    // Prevent native navigation in this harness only. This would not prevent
    // the old JavaScript handler from assigning a javascript: location.
    done.addEventListener("click", event => event.preventDefault());
    done.click();
    await settle();
    outcomes.push(["Done ignores executable JSON navigation", window.__doneXss === false && done.getAttribute("href") === "#notes"]);
    crypto.randomUUID = randomUUID;
    const failed = outcomes.filter(([, passed]) => !passed);
    document.getElementById("results").textContent = `${failed.length ? "FAIL" : "PASS"}: ${outcomes.length} checks; DOMPurify ${version}\n` + outcomes.map(([name, passed]) => `${passed ? "PASS" : "FAIL"} ${name}`).join("\n");
    document.documentElement.dataset.testResult = failed.length ? "fail" : "pass";
  })().catch((error) => {
    document.getElementById("results").textContent = `FAIL: ${error.message}`;
    document.documentElement.dataset.testResult = "fail";
  });
</script>
